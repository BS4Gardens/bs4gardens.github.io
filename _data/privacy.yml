# Feitenlijst privacy BS4Gardens, versie 3 (Burchard 2026-11-13), VARIANT B (site nog op GitHub Pages). Leidend voor privacy.md, cookies.md en de cookiebanner.
# Eigen versie en datum, los van de voorwaarden (art. 17.5 vanaf v7); de korte versie staat in artikel 17, foto's in artikel 16.
# Wijzigt hier iets: alle lagen aanpassen en nieuw versienummer; klopt artikel 17 niet meer, dan ook de voorwaarden.
# datum = publicatiedatum. Gaat de site naar een Europese host (Combell): variant A, versie 4 met nieuwe datum (zie vaultnotitie, punt 9).
versie: 3
datum: "13 november 2026"
kort_in_voorwaarden: "artikel 17"
verantwoordelijke: "BS4Gardens BV, Ploegstraat 8, 9800 Deinze, ondernemingsnummer 1043.253.212, RPR Gent, afdeling Gent"
contact_mail: "gecodeerd in _data/contact.yml (mail_c); hier bewust niet leesbaar, de repo is publiek"   # op de site enkel via de klikknop (mail.html), nooit leesbaar in HTML
keuze_bewaren_dagen: 182          # localStorage bs4g-cookies, enkel als GA4 aan staat
ga_cookie_dagen: 395              # _ga en _ga_<code>, niet verlengd bij elk bezoek
ga_bewaring: "2 maanden"          # zo instellen in GA4 zodra GA4 aan gaat
ga_gebeurtenissen:
  - "klik om te bellen"
  - "klik op WhatsApp"
  - "klik om te mailen"
  - "klik op Instagram"
  - "welke dienstpagina je bekijkt"
  - "welk project je bekijkt"
bewaring:
