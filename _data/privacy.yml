  fotos_promotie: "zolang gebruikt of tot intrekking of weigering; verspreid drukwerk niet terug"
  bewijs_keuze_fotos: "zolang de foto's gebruikt worden, daarna 5 jaar"
  hosting_logs: "volgens het privacybeleid van de webhost (naam op vraag)"
  reservekopieen: "een beperkte tijd, versleuteld, tot ze daar volgens het bewaarschema verdwijnen; enkel voor herstel"
herkomst:
  - "de klant zelf"
  - "onderneming of vereniging van de contactpersoon"
  - "bank: naam, rekeningnummer, mededeling bij betaling"
  - "KLIP: ligging kabels en leidingen"
  - "KBO of VIES: nazicht ondernemings- of btw-nummer, als we dat nakijken"
