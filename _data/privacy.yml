  - "leverancier van e-mail en cloudopslag (Amerikaans bedrijf)"
  - "dienstverlener in België voor informatica, opslag en reservekopieën"
  - "AI-hulpmiddelen van een Amerikaans bedrijf, tekst- en mailverwerking en opvolging administratie"
  - "boekhoudkantoor"
  - "boekhoud- en facturatieprogramma, ook Peppol-facturatie"
  - "bank, voor betalingen"
  - "dienstverlener in de EU die de afschriften van de zakelijke rekening ophaalt"
